<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="鱼心快跑：戴着安全帽、正推着一枚巨大飞轮的青色小鱼">
  <defs>
    <pattern id="dotgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.6" fill="#0E201C" opacity="0.075" />
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="120" fill="#F6F4EE" />
  <rect width="1024" height="1024" rx="120" fill="url(#dotgrid)" />

  <!-- 地面虚线 -->
  <path d="M96 856 H 928" stroke="#0E201C" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 34" opacity="0.35" />

  <!-- 飞轮 -->
  <g transform="translate(736 556)">
    <circle r="240" fill="#0A958A" opacity="0.12" />
    <circle r="240" fill="none" stroke="#0A958A" stroke-width="28" />
    <circle r="204" fill="none" stroke="#0A958A" stroke-width="8" opacity="0.45" />
    <g fill="#0A958A">
      <rect x="-13" y="-214" width="26" height="166" rx="13" />
      <rect x="-13" y="-214" width="26" height="166" rx="13" transform="rotate(60)" />
      <rect x="-13" y="-214" width="26" height="166" rx="13" transform="rotate(120)" />
      <rect x="-13" y="-214" width="26" height="166" rx="13" transform="rotate(180)" />
      <rect x="-13" y="-214" width="26" height="166" rx="13" transform="rotate(240)" />
      <rect x="-13" y="-214" width="26" height="166" rx="13" transform="rotate(300)" />
    </g>
    <circle r="58" fill="#0E201C" />
    <circle r="18" fill="#35D8C4" />
    <!-- 轮缘上被甩起来的一枚硬币 -->
    <g transform="translate(150 -186) rotate(18)">
      <circle r="40" fill="#E85734" />
      <circle r="25" fill="none" stroke="#F6F4EE" stroke-width="7" opacity="0.9" />
    </g>
  </g>

  <!-- 推力线 -->
  <g stroke="#3568D4" stroke-width="10" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M56 486 q 46 -18 92 0" />
    <path d="M40 560 q 52 -20 104 0" />
    <path d="M60 636 q 46 -18 92 0" />
  </g>

  <!-- 小鱼：前倾、双脚蹬地、两鳍推轮 -->
  <g transform="translate(300 604) rotate(-12)">
    <!-- 后腿与脚 -->
    <g stroke="#0A958A" stroke-width="30" stroke-linecap="round" fill="none">
      <path d="M-38 96 L -142 200" />
      <path d="M18 108 L -30 214" />
    </g>
    <g fill="#0A958A">
      <ellipse cx="-152" cy="208" rx="30" ry="17" />
      <ellipse cx="-38" cy="222" rx="30" ry="17" />
    </g>

    <!-- 尾巴 -->
    <path d="M-142 -6 L -256 -96 Q -224 -6 -256 84 Z" fill="#0A958A" />

    <!-- 身体 -->
    <ellipse rx="158" ry="112" fill="#0A958A" />
    <ellipse cx="24" cy="36" rx="114" ry="56" fill="#35D8C4" />

    <!-- 背鳍 -->
    <path d="M-52 -100 Q -8 -164 42 -108 Z" fill="#046B63" />

    <!-- 推轮的前鳍 -->
    <g stroke="#0A958A" stroke-width="32" stroke-linecap="round" fill="none">
      <path d="M104 -30 Q 186 -54 236 -18" />
      <path d="M108 26 Q 188 26 232 54" />
    </g>

    <!-- 眼睛（用力到眯起来） -->
    <path d="M66 -46 q 26 -22 52 -2" stroke="#0E201C" stroke-width="13" fill="none" stroke-linecap="round" />
    <!-- 嘴 -->
    <path d="M118 34 q 24 20 46 4" stroke="#0E201C" stroke-width="11" fill="none" stroke-linecap="round" />

    <!-- 安全帽 -->
    <g transform="translate(46 -116) rotate(9)">
      <path d="M-98 22 A 98 86 0 0 1 98 22 Z" fill="#E85734" />
      <rect x="-120" y="16" width="240" height="28" rx="14" fill="#E85734" />
      <rect x="-11" y="-72" width="22" height="36" rx="11" fill="#FF7C5E" />
      <path d="M-54 -30 A 60 54 0 0 1 4 -62" stroke="#FF7C5E" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- 汗珠 -->
    <g fill="#3568D4">
      <path d="M146 -190 q 16 26 0 40 q -16 -14 0 -40 Z" />
      <path d="M-10 -220 q 14 22 0 34 q -14 -12 0 -34 Z" opacity="0.8" />
    </g>
  </g>

  <!-- 角标：起点 -->
  <g transform="translate(146 232)">
    <circle r="52" fill="none" stroke="#E85734" stroke-width="10" />
    <path d="M-18 22 L 22 -22 M 4 -24 L 24 -24 L 24 -4" stroke="#0A958A" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
